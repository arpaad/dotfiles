# ~/.config/yazi/yazi.toml  ·  managed in ~/.dotfiles, symlinked by stow
#
# Yazi 26.x. The section is [mgr] — it was renamed from [manager] in 25.5, so
# older blog posts will show the old name and silently do nothing.
#
# Opening files: yazi shells out to $EDITOR, which zsh/.zshrc sets to nvim.

[mgr]
sort_by         = "natural"   # file2 before file10
sort_dir_first  = true
show_hidden     = false       # toggle live with  .
show_symlink    = true
linemode        = "size"      # right-hand column: size (try "mtime", "permissions")
ratio           = [1, 3, 4]   # parent | current | preview — favour the preview pane

[preview]
tab_size   = 2
max_width  = 1000
max_height = 1000

# ---------------------------------------------------------------------------
# Previewers
# ---------------------------------------------------------------------------
# `piper` (yazi's official plugin) pipes any shell command's output into the
# preview pane. Installed via package.toml — run `ya pkg install` to fetch it.
#
#   $w  width of the preview pane      $1  the file being previewed
#   $t  terminal theme: "dark", "light", or "auto"
#
# Markdown gets rendered by glow, wrapped to the *actual* pane width and
# matching your terminal's light/dark mode. Just moving the cursor onto a .md
# file renders it — no keypress needed.
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=$t "$1"'

[[plugin.prepend_previewers]]
url = "*.markdown"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=$t "$1"'

# ---------------------------------------------------------------------------
# Openers
# ---------------------------------------------------------------------------
# `glow` here is the full-screen, scrollable read — press O on a markdown file
# and pick it. Plain Enter still opens the file in Neovim for editing.
[[opener.glow]]
run   = 'CLICOLOR_FORCE=1 glow -p -s=auto "$1"'
block = true
desc  = "Read with glow"

[[opener.edit]]
run   = '$EDITOR "$@"'
block = true
desc  = "Edit in $EDITOR"

[open]
prepend_rules = [
  # Enter → edit in Neovim (first entry wins).  O → menu, including glow.
  { url = "*.md", use = [ "edit", "glow", "reveal" ] },
  { url = "*.markdown", use = [ "edit", "glow", "reveal" ] },
]
