# ~/.config/tmux/tmux.conf  ·  managed in ~/.dotfiles, symlinked by stow

# Prefix: Ctrl-a instead of Ctrl-b (easier to reach). Tutorials say Ctrl-b;
# just press Ctrl-a where they say Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse: scroll, click panes, drag to resize.
set -g mouse on

# Start numbering windows/panes at 1 (closer to the home row of number keys).
set -g base-index 1
setw -g pane-base-index 1

# Snappier key response (helps Neovim).
set -sg escape-time 10

# Bigger scrollback buffer.
set -g history-limit 10000

# Vi keys in copy mode.
setw -g mode-keys vi

# Splits that keep the current directory.
# Side-by-side:  prefix v  (or prefix | )   Top/bottom:  prefix s  (or prefix - )
# (v/s are easy on a Hungarian layout where | is AltGr+W.)
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l (vim-style).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this config:  prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# True colour.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
